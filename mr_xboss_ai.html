<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mr Xboss AI - الوضع الإبداعي والبرمجي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .chat-container {
            width: 100%;
            max-width: 950px;
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            border: 1px solid rgba(79, 129, 232, 0.5);
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #0f172f, #0a0f1e);
            padding: 20px 24px;
            border-bottom: 1px solid #1e2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .title h1 {
            font-size: 1.6rem;
            background: linear-gradient(120deg, #fff, #7aa2f7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .title p {
            color: #8aa2ca;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .badge {
            background: #1e2f4b;
            padding: 6px 14px;
            border-radius: 40px;
            color: #b3e0ff;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .chat-box {
            height: 460px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0b1020;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 0.95rem;
            line-height: 1.45;
            animation: fadeIn 0.25s ease;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #2266dd, #1a4fbb);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .bot-message {
            align-self: flex-start;
            background: #1a253f;
            color: #eef3ff;
            border-bottom-left-radius: 6px;
            border: 1px solid #2b3a5a;
        }

        .typing {
            align-self: flex-start;
            background: #1a253f;
            color: #bbd4ff;
            font-style: italic;
            padding: 10px 18px;
        }

        .input-area {
            padding: 18px 20px 22px;
            background: #0c1222;
            border-top: 1px solid #19213a;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: #111a2b;
            border: 1px solid #2a3a60;
            color: #bfd6ff;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .mode-btn.active {
            background: #2b4f9e;
            border-color: #6ca0ff;
            color: white;
            box-shadow: 0 0 8px rgba(79, 129, 232, 0.5);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: #0f172f;
            border: 1px solid #293b60;
            border-radius: 28px;
            padding: 12px 18px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #4f81e8;
            box-shadow: 0 0 0 2px rgba(79, 129, 232, 0.2);
        }

        button {
            background: linear-gradient(95deg, #2b5fde, #1c44a5);
            border: none;
            border-radius: 60px;
            width: 50px;
            height: 50px;
            font-size: 1.4rem;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        button:hover {
            background: #3f72e5;
            transform: scale(0.96);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0f18;
        }
        ::-webkit-scrollbar-thumb {
            background: #2f4170;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="title">
            <h1>🤖 Mr Xboss AI</h1>
            <p>إبداعي · برمجي · سريع</p>
        </div>
        <div class="badge">coreKtx v2.0</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot-message">
            ✨ أهلاً! أنا Mr Xboss AI. اختر الوضع:<br>
            • 🎨 **إبداعي** → ما أجادل، أتفهم وأشجع.<br>
            • 💻 **برمجي** → أجاوب على الأكواد والمنطق.<br>
            • 🎩 **رسمي** + ✨ **عادي**.
        </div>
    </div>

    <div class="input-area">
        <div class="mode-selector" id="modeSelector">
            <button class="mode-btn active" data-mode="normal">✨ عادي</button>
            <button class="mode-btn" data-mode="formal">🎩 رسمي</button>
            <button class="mode-btn" data-mode="creative">🎨 إبداعي (لا جدال)</button>
            <button class="mode-btn" data-mode="coding">💻 برمجي</button>
        </div>
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="اكتب سؤالك هنا ..."></textarea>
            <button id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script>
    (function() {
        let currentMode = "normal";
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');

        // ضبط الأزرار
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.getAttribute('data-mode');
                const modeName = btn.innerText.trim();
                addBotMessage(`✅ تم التبديل إلى الوضع **${modeName}**`);
            });
        });

        // وظيفة الردود الذكية حسب طول السؤال (3 ثواني + طول)
        function generateReply(question, mode) {
            const q = question.trim();
            const len = q.length;
            let baseDelay = 800; // أقل شي
            if (len > 150) baseDelay = 2200;
            else if (len > 60) baseDelay = 1500;
            else baseDelay = 800;

            // الوضع الإبداعي (ما يجادل نهائياً)
            if (mode === 'creative') {
                return `🎨 **رد إبداعي (بدون جدال)**:\n"${q}"\n\nرأيك يحترم، وأنا هنا لأفهم لا لأجادل. فكرتك جميلة، كيف أقدر أطورها معك؟ 🌟`;
            }

            // الوضع البرمجي (أي كود أو أمر برمجي)
            if (mode === 'coding') {
                if (q.includes('كود') || q.includes('برمج') || q.includes('html') || q.includes('css') || q.includes('js') || q.includes('جافا') || q.includes('بايثون')) {
                    return `💻 **تحليل برمجي**:\nممتاز، فهمت طلبك البرمجي. الحل المبدئي:\n\`\`\`\n// بناءً على: "${q.substring(0, 90)}"\nfunction smartSolution(input) {\n  return "نتيجة مخصصة حسب متطلباتك";\n}\n\`\`\`\nأعطني تفاصيل أكثر وسأكتب كود كامل.`;
                } else {
                    return `💻 **الوضع البرمجي**:\nأهلاً! اشرح المهمة البرمجية بدقة (لغة، مدخلات، مخرجات) وسأقدم لك كوداً نظيفاً.`;
                }
            }

            // الوضع الرسمي
            if (mode === 'formal') {
                return `🎩 **الرد الرسمي**:\nتحية طيبة. بناءً على استفسارك "${q.substring(0, 60)}..."، يسعدنا تقديم الإجابة المناسبة. هل تطلب المزيد من التفاصيل؟`;
            }

            // الوضع العادي
            if (q.includes('مرحبا') || q.includes('السلام') || q.includes('هلا')) {
                return '🌹 وعليكم السلام ورحمة الله! أهلاً بك. كيف أقدر أساعدك اليوم؟';
            }
            if (q.includes('شكرا') || q.includes('مشكور')) {
                return '🙏 العفو، هذا واجبي. أنا موجود لأخدمك في أي وقت.';
            }
            if (q.includes('اسمك') || q.includes('مين انت') || q.includes('من انت')) {
                return '🤖 أنا Mr Xboss AI، مساعد عربي ذكي. أستطيع التبديل بين الوضع العادي، الرسمي، الإبداعي (بدون جدال)، والبرمجي.';
            }
            return `✨ **رد سريع**:\nسؤالك: "${q}"\nأنا هنا للإجابة. جرب الوضع الإبداعي أو البرمجي لميزات إضافية.`;
        }

        // دوال المساعدة
        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user-message';
            div.textContent = text;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function addBotMessage(text) {
            const div = document.createElement('div');
            div.className = 'message bot-message';
            div.innerHTML = text.replace(/\n/g, '<br>');
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message typing';
            div.textContent = '✍️ Mr Xboss يكتب...';
            chatBox.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // إرسال الرسالة مع مدة تتناسب مع طول السؤال (3 ثواني كحد أقصى)
        function sendMessage() {
            const question = userInput.value.trim();
            if (!question) return;

            addUserMessage(question);
            userInput.value = '';
            userInput.style.height = 'auto';

            const typingId = showTypingIndicator();

            // حساب الوقت: 0.8~2.5 ثانية حسب طول النص
            let delay = Math.min(800 + Math.floor(question.length / 15) * 60, 2500);
            setTimeout(() => {
                removeTypingIndicator(typingId);
                const reply = generateReply(question, currentMode);
                addBotMessage(reply);
                scrollToBottom();
            }, delay);
        }

        // ربط الحدث بطريقة مضمونة
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    })();
</script>

</body>
</html>
