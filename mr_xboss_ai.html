<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Xboss AI - المساعد العربي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            background: rgba(18, 25, 45, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            border: 1px solid rgba(79, 129, 232, 0.4);
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #0f172f, #0a0f1e);
            padding: 20px 24px;
            border-bottom: 1px solid #1e2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .title h1 {
            color: #fff;
            font-size: 1.5rem;
            background: linear-gradient(120deg, #fff, #7aa2f7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .title p {
            color: #8aa2ca;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .badge {
            background: #1e2f4b;
            padding: 6px 14px;
            border-radius: 40px;
            color: #b3e0ff;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .chat-box {
            height: 460px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0b1020;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 22px;
            font-size: 0.95rem;
            line-height: 1.45;
            animation: fadeIn 0.25s ease;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #2266dd, #1a4fbb);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .bot-message {
            align-self: flex-start;
            background: #1a253f;
            color: #eef3ff;
            border-bottom-left-radius: 6px;
            border: 1px solid #2b3a5a;
        }

        .typing {
            align-self: flex-start;
            background: #1a253f;
            color: #bbd4ff;
            font-style: italic;
            padding: 10px 18px;
        }

        .input-area {
            padding: 18px 20px 22px;
            background: #0c1222;
            border-top: 1px solid #19213a;
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: #111a2b;
            border: 1px solid #2a3a60;
            color: #bfd6ff;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .mode-btn.active {
            background: #2b4f9e;
            border-color: #6ca0ff;
            color: white;
            box-shadow: 0 0 8px rgba(79, 129, 232, 0.5);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: #0f172f;
            border: 1px solid #293b60;
            border-radius: 28px;
            padding: 12px 18px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            transition: 0.2s;
        }

        textarea:focus {
            border-color: #4f81e8;
            box-shadow: 0 0 0 2px rgba(79, 129, 232, 0.2);
        }

        button {
            background: linear-gradient(95deg, #2b5fde, #1c44a5);
            border: none;
            border-radius: 60px;
            width: 50px;
            height: 50px;
            font-size: 1.3rem;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: #3f72e5;
            transform: scale(0.96);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px);}
            to { opacity: 1; transform: translateY(0);}
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0f18;
        }
        ::-webkit-scrollbar-thumb {
            background: #2f4170;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="title">
            <h1>🤖 Mr Xboss AI</h1>
            <p>مساعد عربي ذكي - اختر الوضع المناسب</p>
        </div>
        <div class="badge">coreKtx v1.13.0</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot-message">
            👋 أهلاً! أنا Mr Xboss AI. اسألني أي شيء واختر الوضع: عادي، رسمي، إبداعي، أو برمجي.
        </div>
    </div>

    <div class="input-area">
        <div class="mode-selector" id="modeSelector">
            <button class="mode-btn active" data-mode="normal">✨ عادي</button>
            <button class="mode-btn" data-mode="formal">🎩 رسمي</button>
            <button class="mode-btn" data-mode="creative">🎨 إبداعي</button>
            <button class="mode-btn" data-mode="coding">💻 برمجي</button>
        </div>
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="اكتب سؤالك هنا ..."></textarea>
            <button id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script>
    let currentMode = "normal";
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const modeBtns = document.querySelectorAll('.mode-btn');

    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.getAttribute('data-mode');
            const modeName = btn.innerText.trim();
            addBotMessage(`✅ تم التبديل إلى الوضع **${modeName}**`);
        });
    });

    function sendMessage() {
        const question = userInput.value.trim();
        if (!question) return;

        addUserMessage(question);
        userInput.value = '';
        userInput.style.height = 'auto';

        const typingId = showTypingIndicator();

        setTimeout(() => {
            removeTypingIndicator(typingId);
            const reply = generateReply(question, currentMode);
            addBotMessage(reply);
            scrollToBottom();
        }, 600);
    }

    function generateReply(question, mode) {
        const q = question.toLowerCase();

        if (mode === 'coding') {
            if (q.includes('كود') || q.includes('برنامج') || q.includes('جافا') || q.includes('html')) {
                return `💻 **كود جاهز**:
\`\`\`javascript
// مثال بسيط
function greet() {
  return "مرحباً من Mr Xboss AI";
}
console.log(greet());
\`\`\`
أخبرني ماذا تريد برمجته بالضبط.`;
            }
            return `💻 **الوضع البرمجي**:
أهلاً! اشرح المهمة البرمجية التي تريدها (JavaScript, Python, HTML, CSS) وسأكتب لك الكود المناسب.`;
        }

        if (mode === 'formal') {
            return `🎩 **الرد الرسمي**:
تحية طيبة. بناءً على استفسارك: "${question.substring(0, 60)}..."، يسرنا تقديم المساعدة اللازمة. هل تطلب تفاصيل إضافية؟`;
        }

        if (mode === 'creative') {
            return `🎨 **رد إبداعي**:
واو! سؤالك "${question.substring(0, 50)}" يحفز الخيال. دعني أفكر بشكل مبتكر... 
الذكاء والبرمجة يفتحان أبواباً لا حدود لها. كيف يمكنني مساعدتك بشكل إبداعي اليوم؟`;
        }

        if (q.includes('مرحبا') || q.includes('السلام') || q.includes('هلا')) {
            return '🌹 وعليكم السلام ورحمة الله! أهلاً بك. كيف أقدر أساعدك اليوم؟';
        }
        if (q.includes('شكرا') || q.includes('مشكور')) {
            return '🙏 العفو، هذا واجبي. أنا موجود لأخدمك في أي وقت.';
        }
        if (q.includes('اسمك') || q.includes('مين انت') || q.includes('من انت')) {
            return '🤖 أنا Mr Xboss AI، مساعد عربي ذكي.';
        }

        return `✨ سؤالك: "${question}"`;
    }

    function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'message user-message';
        div.textContent = text;
        chatBox.appendChild(div);
    }

    function addBotMessage(text) {
        const div = document.createElement('div');
        div.className = 'message bot-message';
        div.innerHTML = text.replace(/
/g, '<br>');
        chatBox.appendChild(div);
    }

    function showTypingIndicator() {
        const id = 'typing-' + Date.now();
        const div = document.createElement('div');
        div.id = id;
        div.className = 'message typing';
        div.textContent = 'يكتب...';
        chatBox.appendChild(div);
        return id;
    }

    function removeTypingIndicator(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
</script>

</body>
</html>
