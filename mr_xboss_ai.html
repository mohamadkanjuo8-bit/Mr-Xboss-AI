<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Xboss AI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --bg: #080d1a;
    --surface: #0d1528;
    --surface2: #111d35;
    --border: #1e2f52;
    --accent: #3d7fff;
    --accent2: #00d4ff;
    --text: #e2eaff;
    --text-muted: #6a7fa8;
    --user-bg: linear-gradient(135deg, #1e4fd8, #1238a0);
    --bot-bg: #111d35;
    --code-bg: #0a1020;
    --success: #00e676;
    --radius: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(61,127,255,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(0,212,255,0.05) 0%, transparent 60%);
  }

  .container {
    width: 100%;
    max-width: 900px;
    height: 92vh;
    max-height: 860px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: 28px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(61,127,255,0.1);
  }

  /* Header */
  .header {
    padding: 18px 24px;
    background: linear-gradient(135deg, #0a1020, #0d1528);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: center; gap: 14px; }

  .logo {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 4px 20px rgba(61,127,255,0.4);
    flex-shrink: 0;
  }

  .header-title h1 {
    font-size: 1.15rem;
    font-weight: 700;
    background: linear-gradient(120deg, #fff 30%, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header-title p { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .clear-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 0.75rem;
    font-family: 'Tajawal', sans-serif;
    padding: 6px 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  .clear-btn:hover { background: rgba(255,80,80,0.1); color: #ff6b6b; border-color: rgba(255,80,80,0.3); }

  /* Messages */
  .chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--bg);
    scroll-behavior: smooth;
  }

  .chat-box::-webkit-scrollbar { width: 4px; }
  .chat-box::-webkit-scrollbar-track { background: transparent; }
  .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .message-wrapper {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .message-wrapper.user { align-items: flex-end; }
  .message-wrapper.bot { align-items: flex-start; }

  .message-label {
    font-size: 0.68rem;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .message {
    max-width: 88%;
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 0.93rem;
    line-height: 1.7;
    word-wrap: break-word;
  }

  .user .message {
    background: var(--user-bg);
    color: #fff;
    border-bottom-right-radius: 5px;
    box-shadow: 0 4px 20px rgba(30,79,216,0.3);
  }

  .bot .message {
    background: var(--bot-bg);
    color: var(--text);
    border-bottom-left-radius: 5px;
    border: 1px solid var(--border);
  }

  /* Markdown styles inside bot messages */
  .bot .message h1, .bot .message h2, .bot .message h3 {
    color: var(--accent2);
    margin: 12px 0 6px;
    font-weight: 700;
  }
  .bot .message h1 { font-size: 1.1rem; }
  .bot .message h2 { font-size: 1rem; }
  .bot .message h3 { font-size: 0.95rem; }

  .bot .message p { margin: 6px 0; }

  .bot .message ul, .bot .message ol {
    padding-right: 20px;
    margin: 6px 0;
  }
  .bot .message li { margin: 3px 0; }

  .bot .message strong { color: #fff; font-weight: 700; }
  .bot .message em { color: var(--accent2); font-style: italic; }

  .bot .message a { color: var(--accent); text-decoration: underline; }

  /* Inline code */
  .bot .message code:not(pre code) {
    background: var(--code-bg);
    color: var(--accent2);
    padding: 2px 6px;
    border-radius: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85em;
    border: 1px solid var(--border);
  }

  /* Code blocks */
  .code-wrapper {
    position: relative;
    margin: 10px 0;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d1528;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }

  .code-lang {
    font-size: 0.72rem;
    color: var(--accent2);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .copy-btn {
    background: rgba(61,127,255,0.15);
    border: 1px solid rgba(61,127,255,0.3);
    border-radius: 7px;
    color: var(--accent);
    font-size: 0.72rem;
    font-family: 'Tajawal', sans-serif;
    padding: 4px 10px;
    cursor: pointer;
    transition: 0.2s;
    display: flex; align-items: center; gap: 5px;
  }
  .copy-btn:hover { background: rgba(61,127,255,0.3); color: #fff; }
  .copy-btn.copied { background: rgba(0,230,118,0.15); border-color: rgba(0,230,118,0.3); color: var(--success); }

  .bot .message pre {
    margin: 0 !important;
    border-radius: 0 !important;
    background: var(--code-bg) !important;
    padding: 14px !important;
    overflow-x: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    line-height: 1.6;
  }

  .bot .message pre code {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    font-size: inherit !important;
    color: inherit !important;
    border-radius: 0 !important;
  }

  .bot .message table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 0.88rem;
  }
  .bot .message th {
    background: var(--surface2);
    color: var(--accent2);
    padding: 8px 12px;
    text-align: right;
    border: 1px solid var(--border);
  }
  .bot .message td {
    padding: 7px 12px;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .bot .message tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  .bot .message blockquote {
    border-right: 3px solid var(--accent);
    padding: 8px 14px;
    margin: 8px 0;
    background: rgba(61,127,255,0.05);
    border-radius: 0 8px 8px 0;
    color: var(--text-muted);
  }

  .bot .message hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  /* Typing indicator */
  .typing-wrapper {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 18px;
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    border-bottom-left-radius: 5px;
    max-width: 200px;
    animation: slideIn 0.3s ease;
  }
  .typing-dots { display: flex; gap: 5px; align-items: center; }
  .typing-dots span {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  .typing-text { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }

  /* Input */
  .input-area {
    padding: 16px 20px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 10px 14px;
    transition: 0.2s;
  }
  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(61,127,255,0.12);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.93rem;
    resize: none;
    line-height: 1.5;
    max-height: 140px;
    overflow-y: auto;
    direction: rtl;
  }
  textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), #1e4fd8);
    border: none;
    border-radius: 12px;
    color: white;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
    flex-shrink: 0;
    box-shadow: 0 4px 15px rgba(61,127,255,0.4);
  }
  .send-btn:hover { transform: scale(0.95); box-shadow: 0 2px 8px rgba(61,127,255,0.5); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .input-hint {
    font-size: 0.68rem;
    color: var(--text-muted);
    text-align: center;
    margin-top: 8px;
  }

  /* Welcome message */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    flex: 1;
  }
  .welcome-icon { font-size: 2.5rem; }
  .welcome h2 { font-size: 1.1rem; color: var(--text); font-weight: 600; }
  .welcome p { font-size: 0.85rem; line-height: 1.7; max-width: 380px; }

  .suggestion-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }
  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 0.8rem;
    color: var(--text);
    cursor: pointer;
    transition: 0.2s;
    font-family: 'Tajawal', sans-serif;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent2); background: rgba(61,127,255,0.08); }

  @media (max-width: 600px) {
    .container { height: 100vh; border-radius: 0; }
    .message { max-width: 95%; font-size: 0.88rem; }
    .header { padding: 14px 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">🤖</div>
      <div class="header-title">
        <h1>Mr Xboss AI</h1>
        <p>ذكاء اصطناعي متكامل للبرمجة والتطوير</p>
      </div>
    </div>
    <div class="header-right">
      <div class="status-dot"></div>
      <button class="clear-btn" onclick="clearChat()">🗑 مسح</button>
    </div>
  </div>

  <!-- Chat Box -->
  <div class="chat-box" id="chatBox">
    <div class="welcome" id="welcomeScreen">
      <div class="welcome-icon">⚡</div>
      <h2>مرحباً بك في Mr Xboss AI</h2>
      <p>أنا مساعدك الذكي للبرمجة والتطوير. أقدر أعدل أكوادك، أصلح الأخطاء، أشرح المفاهيم، وأكتب كود من الصفر.</p>
      <div class="suggestion-chips">
        <div class="chip" onclick="fillInput('اكتب لي كود Python لترتيب قائمة أرقام')">🐍 كود Python</div>
        <div class="chip" onclick="fillInput('صلح هالخطأ: ')">🔧 صلح خطأ</div>
        <div class="chip" onclick="fillInput('اشرح لي شو هو الـ API وكيف يشتغل')">📖 شرح مفهوم</div>
        <div class="chip" onclick="fillInput('اكتب لي صفحة HTML احترافية')">🌐 صفحة HTML</div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea
        id="userInput"
        rows="1"
        placeholder="اسألني عن أي كود أو مشكلة برمجية..."
        onInput="autoResize(this)"
        onKeydown="handleKey(event)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="input-hint">Enter للإرسال · Shift+Enter لسطر جديد</div>
  </div>
</div>

<script>
const API_KEY = "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";
const API_URL = "https://openrouter.ai/api/v1/chat/completions";

// Conversation history (for context memory)
let conversationHistory = [
  {
    role: "system",
    content: `أنت Mr Xboss AI، مساعد برمجي وتقني متقدم. أنت خبير في:
- كتابة وتعديل الأكواد بجميع لغات البرمجة (Python, JavaScript, HTML, CSS, Java, C++, وغيرها)
- تصحيح الأخطاء البرمجية وشرح سببها بوضوح
- شرح المفاهيم التقنية بطريقة بسيطة ومفهومة
- تحسين الأكواد وجعلها أفضل وأسرع
- بناء مشاريع كاملة خطوة بخطوة

قواعد الرد:
1. استخدم Markdown في ردودك دائماً (كود داخل code blocks، عناوين، قوائم)
2. الأكواد دائماً داخل \`\`\`اسم_اللغة ... \`\`\`
3. اشرح الكود بعد ما تكتبه بشكل مختصر
4. إذا في خطأ، اشرح السبب أولاً ثم اعطِ الحل
5. الردود بالعربية، لكن أسماء المتغيرات والكود بالإنجليزي
6. كن مباشر وعملي، ما تطوّل بلا داعي`
  }
];

const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const welcomeScreen = document.getElementById('welcomeScreen');

// Configure marked
marked.setOptions({
  breaks: true,
  gfm: true
});

// Custom renderer for code blocks
const renderer = new marked.Renderer();
renderer.code = function(code, language) {
  const lang = language || 'text';
  const validLang = hljs.getLanguage(lang) ? lang : 'plaintext';
  const highlighted = hljs.highlight(code, { language: validLang, ignoreIllegals: true }).value;
  const id = 'code-' + Math.random().toString(36).substr(2, 9);
  return `
    <div class="code-wrapper">
      <div class="code-header">
        <span class="code-lang">${lang}</span>
        <button class="copy-btn" onclick="copyCode('${id}', this)">📋 نسخ</button>
      </div>
      <pre><code id="${id}" class="hljs language-${validLang}">${highlighted}</code></pre>
    </div>
  `;
};
marked.use({ renderer });

function copyCode(id, btn) {
  const code = document.getElementById(id).innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✅ تم النسخ';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 نسخ';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function fillInput(text) {
  userInput.value = text;
  userInput.focus();
  autoResize(userInput);
}

function addUserMessage(text) {
  hideWelcome();
  const wrapper = document.createElement('div');
  wrapper.className = 'message-wrapper user';
  wrapper.innerHTML = `
    <span class="message-label">أنت</span>
    <div class="message">${escapeHtml(text)}</div>
  `;
  chatBox.appendChild(wrapper);
  scrollDown();
}

function addBotMessage(text) {
  const wrapper = document.createElement('div');
  wrapper.className = 'message-wrapper bot';
  const rendered = marked.parse(text);
  wrapper.innerHTML = `
    <span class="message-label">Mr Xboss AI</span>
    <div class="message">${rendered}</div>
  `;
  chatBox.appendChild(wrapper);
  // Re-highlight any code blocks
  wrapper.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  scrollDown();
}

function showTyping() {
  hideWelcome();
  const div = document.createElement('div');
  div.id = 'typing';
  div.className = 'message-wrapper bot';
  div.innerHTML = `
    <div class="typing-wrapper">
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
      <span class="typing-text">يفكر...</span>
    </div>
  `;
  chatBox.appendChild(div);
  scrollDown();
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function hideWelcome() {
  if (welcomeScreen) welcomeScreen.style.display = 'none';
}

function scrollDown() {
  chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\n/g, '<br>');
}

function clearChat() {
  // Keep only system message
  conversationHistory = [conversationHistory[0]];
  chatBox.innerHTML = '';
  welcomeScreen.style.display = '';
  chatBox.appendChild(welcomeScreen);
}

async function sendMessage() {
  const question = userInput.value.trim();
  if (!question || sendBtn.disabled) return;

  // Add to UI
  addUserMessage(question);
  userInput.value = '';
  userInput.style.height = 'auto';

  // Add to history
  conversationHistory.push({ role: "user", content: question });

  // Lock input
  sendBtn.disabled = true;
  showTyping();

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${API_KEY}`,
        "Content-Type": "application/json",
        "HTTP-Referer": "https://mrxboss.vercel.app",
        "X-Title": "Mr Xboss AI"
      },
      body: JSON.stringify({
        model: "openai/gpt-4o-mini",
        messages: conversationHistory,
        max_tokens: 3000,
        temperature: 0.7
      })
    });

    const data = await response.json();
    hideTyping();

    if (data.choices && data.choices[0]?.message?.content) {
      const reply = data.choices[0].message.content;
      conversationHistory.push({ role: "assistant", content: reply });
      addBotMessage(reply);
    } else {
      addBotMessage("⚠️ حدث خطأ في الاتصال. تأكد من صلاحية الـ API Key وحاول مجدداً.");
      console.error(data);
    }

  } catch (error) {
    hideTyping();
    addBotMessage("⚠️ مشكلة في الاتصال بالإنترنت. تأكد من اتصالك وحاول مجدداً.");
    console.error(error);
  }

  sendBtn.disabled = false;
  userInput.focus();
}
</script>
</body>
</html>
