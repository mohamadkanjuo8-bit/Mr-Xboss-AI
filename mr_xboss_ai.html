<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Xboss AI - ذكاء حقيقي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .chat-container {
            width: 100%;
            max-width: 950px;
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            border: 1px solid rgba(79, 129, 232, 0.5);
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #0f172f, #0a0f1e);
            padding: 20px 24px;
            border-bottom: 1px solid #1e2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .title h1 {
            font-size: 1.6rem;
            background: linear-gradient(120deg, #fff, #7aa2f7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .title p { color: #8aa2ca; font-size: 0.75rem; margin-top: 4px; }
        .badge { background: #1e2f4b; padding: 6px 14px; border-radius: 40px; color: #b3e0ff; font-size: 0.7rem; font-weight: bold; }
        .chat-box { height: 460px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #0b1020; }
        .message { max-width: 85%; padding: 12px 18px; border-radius: 24px; font-size: 0.95rem; line-height: 1.45; animation: fadeIn 0.25s ease; word-wrap: break-word; }
        .user-message { align-self: flex-end; background: linear-gradient(135deg, #2266dd, #1a4fbb); color: white; border-bottom-right-radius: 6px; }
        .bot-message { align-self: flex-start; background: #1a253f; color: #eef3ff; border-bottom-left-radius: 6px; border: 1px solid #2b3a5a; }
        .typing { align-self: flex-start; background: #1a253f; color: #bbd4ff; font-style: italic; padding: 10px 18px; }
        .input-area { padding: 18px 20px 22px; background: #0c1222; border-top: 1px solid #19213a; }
        .input-wrapper { display: flex; gap: 12px; align-items: center; }
        textarea { flex: 1; background: #0f172f; border: 1px solid #293b60; border-radius: 28px; padding: 12px 18px; color: white; font-family: inherit; font-size: 0.9rem; resize: none; outline: none; }
        textarea:focus { border-color: #4f81e8; box-shadow: 0 0 0 2px rgba(79, 129, 232, 0.2); }
        button { background: linear-gradient(95deg, #2b5fde, #1c44a5); border: none; border-radius: 60px; width: 50px; height: 50px; font-size: 1.4rem; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        button:hover { background: #3f72e5; transform: scale(0.96); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a0f18; }
        ::-webkit-scrollbar-thumb { background: #2f4170; border-radius: 10px; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div class="title"><h1>🤖 Mr Xboss AI</h1><p>ذكاء اصطناعي حقيقي - اسأل أي شيء</p></div>
        <div class="badge">OpenRouter AI</div>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">✨ أهلاً! أنا Mr Xboss AI، مشغل بنماذج ذكاء اصطناعي حقيقي (GPT-4o mini). اسألني أي شيء!</div>
    </div>
    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="اكتب سؤالك هنا ..."></textarea>
            <button id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script>
    const API_KEY = "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";
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'message user-message';
        div.textContent = text;
        chatBox.appendChild(div);
        scrollToBottom();
    }

    function addBotMessage(text) {
        const div = document.createElement('div');
        div.className = 'message bot-message';
        div.innerHTML = text.replace(/\n/g, '<br>');
        chatBox.appendChild(div);
        scrollToBottom();
    }

    function showTyping() {
        const id = 'typing-' + Date.now();
        const div = document.createElement('div');
        div.id = id;
        div.className = 'message typing';
        div.textContent = '✍️ Mr Xboss AI يفكر...';
        chatBox.appendChild(div);
        scrollToBottom();
        return id;
    }

    function removeTyping(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const question = userInput.value.trim();
        if (!question) return;

        addUserMessage(question);
        userInput.value = '';
        const typingId = showTyping();

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": "openai/gpt-4o-mini",
                    "messages": [
                        { "role": "system", "content": "أنت مساعد عربي ذكي اسمك Mr Xboss AI. ردودك مفيدة، دقيقة، ومباشرة. جاوب بالعربية الفصحى أو العامية حسب سؤال المستخدم." },
                        { "role": "user", "content": question }
                    ]
                })
            });

            const data = await response.json();
            removeTyping(typingId);

            if (data.choices && data.choices[0] && data.choices[0].message) {
                addBotMessage(data.choices[0].message.content);
            } else {
                addBotMessage("عذراً، حدث خطأ في الذكاء الاصطناعي. حاول مرة أخرى.");
                console.error(data);
            }
        } catch (error) {
            removeTyping(typingId);
            addBotMessage("حدث خطأ في الاتصال. تأكد من اتصالك بالإنترنت وحاول مجدداً.");
            console.error(error);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
